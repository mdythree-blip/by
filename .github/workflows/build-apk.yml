# ============================================================
#  一键出 APK
#
#  推到 GitHub 自动编译。编译成功 → APK 在 Artifacts 里。
#  编译失败 → 日志会写成仓库根目录的 build-log.txt，任何人在
#              https://raw.githubusercontent.com/<用户>/<仓库>/main/build-log.txt
#             都能直接读到，方便远程排查。
#
#  build-log.txt 是调试用的，等编译稳定了可以把那两步删掉。
# ============================================================
name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# 需要写权限，才能把编译日志提交回仓库
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      # AGP 9 建议用 JDK 21（17 有时会在 AGP 内部工具上报错）
      - name: 装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 装 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      # AGP 8.13.2 对应 Gradle 8.14.x（Gradle 9 需要 AGP 9）
      - name: 装 Gradle 8.14.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.6'

      - name: 接受 SDK 许可
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      # continue-on-error：这一步失败也要继续往下跑，好把日志传出来
      - name: 编译 Debug APK
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: 把编译日志写回仓库（方便远程排查）
        if: always()
        run: |
          git config user.email "ci@users.noreply.github.com"
          git config user.name  "ci-bot"
          {
            echo "===== 环境 ====="
            java -version 2>&1
            echo
            echo "===== Gradle ====="
            gradle --version 2>&1 | head -12
            echo
            echo "===== 编译输出 ====="
            cat build.log 2>/dev/null || echo "(没有生成 build.log)"
          } > build-log.txt
          git add -f build-log.txt
          git commit -m "ci: build log [skip ci]" || echo "（日志无变化，跳过提交）"
          git push || echo "（推送失败，可能没有写权限）"

      - name: 上传 APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: yun-drive-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 编译失败 → 整个任务标红
        if: steps.build.outcome != 'success'
        run: |
          echo "::error::编译失败，日志见仓库根目录的 build-log.txt"
          exit 1
